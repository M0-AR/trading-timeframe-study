project:
  name: timeframe-validity
  seed: 20261021
  version: 1.0.0

data:
  cache_dir: data/cache
  binance:
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
    interval: 5m
    start: "2021-01"
    end: "2026-09"
    finest_interval: 1m
    finest_symbol: BTCUSDT
  equities:
    symbols: [AAPL.US, TSLA.US, AMZN.US, VTI.US]
    start: "2000-01-01"
  macro:
    risk_free_series: DTB3
    risk_free_url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTB3

sample:
  is_end: "2024-12-31"
  oos_start: "2025-01-01"

timeframes: ["5m", "15m", "30m", "1h", "4h", "1d"]
timeframe_minutes: {"5m": 5, "15m": 15, "30m": 30, "1h": 60, "4h": 240, "1d": 1440, "1w": 10080}

strategies:
  ma:
    fast: [10, 20, 50]
    slow: [50, 100, 200]
  donchian:
    lookback: [20, 50, 100]
  tsmom:
    lookback: [20, 50, 100]

variants: [base_only, htf_filter, htf_trigger, confluence3]

costs:
  crypto_bps: 12
  equity_bps: 4
  sensitivity_bps: [0, 5, 12, 25, 50]
  impact_k: 0.10
  corwin_schultz: true

backtest:
  execution: next_open
  vol_target: null
  max_leverage: 3.0

stats:
  cscv_slices: 12
  bootstrap_reps: 500
  block_days: 20
  fdr_alpha: 0.05
  dsr_trials: all

protocol:
  decision_budgets_per_week: [21, 42, 168, 336, 1008]
  default_budget: 168

live:
  venues: [kraken, coinbase, okx]
  tolerance_bps: 50
  log_path: results/live_shadow.jsonl
