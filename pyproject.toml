[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfvalidity"
version = "0.1.0"
description = "Cost-aware, pre-registered evaluation of timeframe-dependent trading signals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Timeframe Validity Project" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3.1",
  "scipy>=1.11,<2",
  "pyarrow>=15,<27",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
tfv = "tfvalidity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
